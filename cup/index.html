<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-itunes-app" content="app-id=6761764965">
<meta name="robots" content="noindex">
<title>Join a CoreShift Cup</title>
<style>
  :root { color-scheme: light dark; --bg:#f2f2f7; --card:#fff; --text:#111; --sub:#5c5c63; --btn:#111; --btn-text:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c0c0e; --card:#151518; --text:#fff; --sub:#a8a8b0; --btn:#fff; --btn-text:#0c0c0e; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; padding:24px; box-sizing:border-box; }
  main { max-width:380px; width:100%; background:var(--card); border-radius:28px; padding:28px 24px; text-align:center; }
  h1 { font-size:26px; margin:0 0 8px; letter-spacing:-0.01em; }
  p { font-size:16px; line-height:22px; color:var(--sub); margin:0 0 16px; }
  .btn { display:flex; align-items:center; justify-content:center; height:52px; border-radius:16px; background:var(--btn); color:var(--btn-text);
         font-size:17px; font-weight:600; text-decoration:none; }
  #expiry { font-size:14px; }
  #expiry.expired { color:#d92d20; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Join a CoreShift Cup</h1>
  <p>A friend invited you to a 4-player CoreShift Cup. If CoreShift is installed, this link opens it. If not, get it from the App Store, then open this link again.</p>
  <a class="btn" href="https://apps.apple.com/hu/app/coreshift-abstract-strategy/id6761764965">Get CoreShift on the App Store</a>
  <p id="code" style="margin-top:16px; font-size:14px"></p>
</main>
<script>
  (function () {
    var c = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
    if (/^[A-Z0-9]{8}$/.test(c)) document.getElementById('code').textContent = 'Invite code: ' + c;
  })();
</script>
</body>
</html>
